<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA - Assistente IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="robot-emoji">🤖</span>
                    <h1>ARIA</h1>
                </div>
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span class="status-text">Online</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Chat Area -->
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="message bot-message initial-message">
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            <p>Olá! 👋 Sou o ARIA, seu assistente IA inteligente!</p>
                            <p>Posso ajudar com:</p>
                            <ul class="features-list">
                                <li>🧮 Cálculos matemáticos</li>
                                <li>📝 Análise de texto</li>
                                <li>✅ Gerenciamento de tarefas</li>
                                <li>🔍 Busca de informações</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="action-btn" onclick="quickAction('calcule 10 + 5')">
                    <span>🧮</span>
                    <span>Calcular</span>
                </button>
                <button class="action-btn" onclick="quickAction('criar tarefa')">
                    <span>✅</span>
                    <span>Tarefa</span>
                </button>
                <button class="action-btn" onclick="quickAction('tarefas')">
                    <span>📋</span>
                    <span>Minhas Tarefas</span>
                </button>
                <button class="action-btn" onclick="quickAction('status')">
                    <span>📊</span>
                    <span>Status</span>
                </button>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="userInput" 
                        class="user-input" 
                        placeholder="Digite sua mensagem..."
                        autocomplete="off"
                    >
                    <button class="send-btn" onclick="enviarMensagem()">
                        <span>➤</span>
                    </button>
                </div>
                <div class="input-hints">
                    <small>💡 Digite: calcule, criar tarefa, tarefas, status, ou converse normalmente!</small>
                </div>
            </div>
        </main>
    </div>

    <!-- Floating Action Button (Mobile) -->
    <button class="fab" id="fab" title="Limpar chat">
        <span>🗑️</span>
    </button>

    <script src="script.js"></script>
</body>
</html>
